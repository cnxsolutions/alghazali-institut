[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
; pas de directives user/group : le conteneur est démarré sous l'uid de l'app
listen = 9000
listen.backlog = 511

; Dimensionné sur le plafond mémoire du conteneur (512m, voir
; deploy/alghazali-site.compose.yml), pas sur la charge : un processus WordPress
; pèse ~50 Mo, plus l'opcache partagé (96 Mo, docker/php.ini).
; 6 x 55 + 96 tient sous 512m ; davantage, et le noyau tuerait php-fpm en
; pleine requête au premier pic. Relever ce nombre impose de relever
; mem_limit d'abord.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Interrogé par docker/healthcheck.sh via cgi-fcgi. Le port 9000 n'est publié
; que sur 127.0.0.1 et nginx ne transmet que les *.php : inaccessible du dehors.
ping.path = /fpm-ping
ping.response = pong

; Garde l'environnement de l'image (APP_VERSION, que /up renvoie) dans les
; workers. Le .env, lui, est chargé par wp-config.php à chaque requête.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2

; refuse d'exécuter autre chose que du PHP, même si nginx se trompe
security.limit_extensions = .php
