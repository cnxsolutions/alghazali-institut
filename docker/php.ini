memory_limit = 256M
; Alignés sur client_max_body_size dans deploy/nginx-alghazali-site.conf.
upload_max_filesize = 20M
post_max_size = 20M
; Le site ne fait aucun appel lent pendant une requête : aucun formulaire,
; aucune API externe. Les tâches planifiées passent par le cron.
max_execution_time = 30
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
date.timezone = Europe/Paris

opcache.enable = 1
; 96 et non 128 : le noyau, le thème et l'extension tiennent dans moins de
; 40 Mo, et chaque mégaoctet compte sous le plafond de 512m (voir www.conf).
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; Le code est figé dans l'image et en lecture seule : il ne change jamais
; pendant la vie d'un conteneur. Inutile de vérifier les dates à chaque
; requête ; un déploiement recrée le conteneur, donc l'opcache.
opcache.validate_timestamps = 0
