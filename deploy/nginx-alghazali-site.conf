# ─────────────────────────────────────────────────────────────────────────────
# Al Ghazzali Institut : vhost nginx de alghazali-institut.fr (dépôt cnxsolutions/alghazali-institut)
#
# Posé dans /etc/nginx/sites-available/alghazali-site par deploy/bootstrap-vps.sh,
# en HTTP seul. Le TLS s'ajoute une fois le DNS du domaine pointé sur le VPS :
# `certbot --nginx -d alghazali-institut.fr -d www.alghazali-institut.fr`.
# Le script ne réécrit JAMAIS ce fichier une fois posé : le remplacer ferait
# tomber le HTTPS. Une modification ultérieure se reporte à la main sur le
# serveur.
#
# tests/fumee.sh sert ce même fichier (port de php-fpm et IPv6 adaptés) devant
# l'image : chaque règle ci-dessous est vérifiée avant la mise en production.
# ─────────────────────────────────────────────────────────────────────────────

# www renvoie vers le domaine canonique. $scheme plutôt qu'un https écrit en
# dur : la règle reste juste avant le TLS (http -> http) comme après
# (https -> https).
server {
    listen 80;
    listen [::]:80;
    server_name www.alghazali-institut.fr;
    return 301 $scheme://alghazali-institut.fr$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name alghazali-institut.fr;

    # public/ est une COPIE de l'arborescence de l'image, PHP compris
    # (docker/publier.sh). wp-content/uploads y est un lien vers ../../uploads,
    # les médias. wp-config.php n'y est pas : il vit un niveau au-dessus, dans
    # l'image seulement.
    root /var/www/alghazali-site/public;
    index index.php;
    charset utf-8;

    # Aligné sur upload_max_filesize et post_max_size (docker/php.ini).
    client_max_body_size 20M;

    # .env, .git, .htaccess… : tout ce qui commence par un point, sauf
    # .well-known (validation de certbot).
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Fichiers du noyau sans rôle en ligne : readme.html et license.txt
    # donnent la version exacte de WordPress ; xmlrpc.php sert surtout aux
    # attaques par force brute. wp-config.php n'est pas dans public/, la règle
    # couvre le jour où il y serait.
    location ~ ^/(wp-config\.php|wp-config-sample\.php|readme\.html|license\.txt|xmlrpc\.php)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # L'installeur : sur une base vide, il laisserait n'importe qui créer son
    # propre compte administrateur. Le site s'installe en ligne de commande
    # (docker/installer.sh) ; ceci ferme la porte même si l'on s'en passait.
    location ~ ^/wp-admin/(install|setup-config)\.php$ {
        deny all;
    }

    # Jamais de PHP depuis les médias. Placée AVANT le bloc PHP : nginx retient
    # la première expression régulière qui correspond. Sans elle, un .php
    # glissé dans uploads/ passerait le try_files et php-fpm l'exécuterait,
    # puisqu'il voit les médias au même chemin.
    location ~* ^/wp-content/uploads/.*\.(php\d?|phar|phtml|pht)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # robots.txt et favicon.ico : générés par WordPress quand le fichier
    # n'existe pas. Sans le repli sur index.php, nginx répondrait 404.
    location = /robots.txt  { try_files $uri /index.php?$args; access_log off; log_not_found off; }
    location = /favicon.ico { try_files $uri /index.php?$args; access_log off; log_not_found off; }

    # Fichiers statiques : servis depuis le disque de l'hôte, sans PHP.
    # 7 jours et pas `immutable` : les CSS et JS du thème portent leur version
    # dans ?ver=…, mais pas les polices ni les images. Une police ou une image
    # modifiée sans changer de nom serait servie périmée jusqu'à expiration.
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        # Seuls les .php présents dans public/ partent vers php-fpm.
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9007;
        # $realpath_root : le chemin réel SUR L'HÔTE (/var/www/alghazali-site/public/…),
        # que l'image fait résoudre vers son code par un lien (voir Dockerfile).
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # Comme max_execution_time (docker/php.ini).
        fastcgi_read_timeout 30s;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # Pas de Content-Security-Policy : l'administration de WordPress repose
    # sur des scripts en ligne, et le thème inline sa feuille de style
    # critique. À écrire d'abord en Report-Only.

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/alghazali-site.access.log;
    error_log  /var/log/nginx/alghazali-site.error.log;
}
